packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@tiptap/core': 3.31.3
  '@tiptap/extension-blockquote': 3.31.3
  '@tiptap/extension-bold': 3.31.3
  '@tiptap/extension-code': 3.31.3
  '@tiptap/extension-code-block': 3.31.3
  '@tiptap/extension-document': 3.31.3
  '@tiptap/extension-hard-break': 3.31.3
  '@tiptap/extension-heading': 3.31.3
  '@tiptap/extension-horizontal-rule': 3.31.3
  '@tiptap/extension-italic': 3.31.3
  '@tiptap/extension-link': 3.31.3
  '@tiptap/extension-list': 3.31.3
  '@tiptap/extension-paragraph': 3.31.3
  '@tiptap/extension-strike': 3.31.3
  '@tiptap/extension-text': 3.31.3
  '@tiptap/extensions': 3.31.3
  '@tiptap/pm': 3.31.3
  '@types/better-sqlite3': 9.6.0
  '@types/node': 26.4.1
  'better-sqlite3': 13.0.3
  'drizzle-kit': 0.31.10
  'drizzle-orm': 0.45.2
  effect: 3.22.2
  'markdown-it': 15.0.1
  oxfmt: 0.66.0
  oxlint: 1.81.0
  typescript: 7.0.2

# Package-specific dependencies stay local; shared versions opt into catalog:.
catalogMode: manual

# better-sqlite3 ships prebuilt N-API binaries and needs no compilation; pnpm still flags it because
# the package contains binding.gyp. Denying the build is deliberate - we never compile it from source.
allowBuilds:
  better-sqlite3: false
  esbuild: false
